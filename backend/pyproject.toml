[project]
name = "sale-events"
version = "0.1.0"
description = "steaL sale events: fetch, extract and validate store event dates"
authors = [
    { name = "Yijiang", email = "yluo0117@student.monash.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.123",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 两个 Lambda 的入口文件不在包里，测试从各自的目录导入（文件名互不相同，不会冲突）。
# The two Lambdas' entry files live outside the package; tests import them from their folders (names never clash).
pythonpath = ["functions/sale_events_api", "functions/sale_events_refresh"]
