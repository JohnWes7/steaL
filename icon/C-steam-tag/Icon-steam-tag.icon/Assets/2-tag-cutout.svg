    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="-170" cy="0" r="30" fill="#000" transform="translate(512 700) rotate(-10)"/>
  <g transform="translate(566 700) rotate(-10)" fill="none" stroke="#000"
     stroke-width="56" stroke-linecap="round">
    <line x1="69" y1="-86" x2="-69" y2="86" stroke-width="64"/>
    <circle cx="-56" cy="-50" r="34"/>
    <circle cx="56" cy="50" r="34"/>
  </g>
    </mask>
  </defs>
  <g mask="url(#cut)">
