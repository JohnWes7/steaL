<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3F5A"/>
      <stop offset="1" stop-color="#121C28"/>
    </linearGradient>
    <mask id="hole">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="-170" cy="0" r="30" fill="#000" transform="translate(512 700) rotate(-10)"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- 三缕蒸汽从标签上升起 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" opacity="0.9">
    <path d="M 400 500 C 450 450, 350 400, 400 340 C 450 280, 350 240, 400 190"/>
    <path d="M 512 480 C 562 420, 462 370, 512 300 C 562 240, 462 200, 512 140"/>
    <path d="M 624 500 C 674 450, 574 400, 624 340 C 674 280, 574 240, 624 190"/>
  </g>

  <g mask="url(#hole)">
    <path d="M -270 0 L -150 -110 L 250 -110 L 250 110 L -150 110 Z"
          fill="#8DCF4A" stroke="#8DCF4A" stroke-width="60" stroke-linejoin="round"
          transform="translate(512 700) rotate(-10)"/>
  </g>
  <!-- % 号：加厚到能撑起玻璃质感，两个圆环 + 一根斜杠 -->
  <g transform="translate(566 700) rotate(-10) scale(1.0)" fill="none" stroke="#FFFFFF"
     stroke-width="42" stroke-linecap="round">
    <line x1="69" y1="-86" x2="-69" y2="86" stroke-width="50"/>
    <circle cx="-56" cy="-50" r="34"/>
    <circle cx="56" cy="50" r="34"/>
  </g>
</svg>
