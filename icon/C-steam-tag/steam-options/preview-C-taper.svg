  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- 上细下粗的蒸汽：每缕拆成三段，越往上笔画越细 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.95">
